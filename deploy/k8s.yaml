apiVersion: v1
kind: Namespace
metadata:
  name: load-observatory
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: load-observatory
spec:
  selector: { app: controller }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: load-observatory
spec:
  replicas: 1
  selector: { matchLabels: { app: controller } }
  template:
    metadata: { labels: { app: controller } }
    spec:
      containers:
        - name: controller
          image: load-observatory/controller:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: LISTEN_ADDR, value: ":8080" }]
          ports: [{ containerPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: load-observatory
spec:
  replicas: 1
  selector: { matchLabels: { app: agent } }
  template:
    metadata: { labels: { app: agent } }
    spec:
      containers:
        - name: agent
          image: load-observatory/agent:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: CONTROLLER_URL, value: "http://controller:8080" }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: load-observatory
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: load-observatory
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: load-observatory/web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: limit-egress
  namespace: load-observatory
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
