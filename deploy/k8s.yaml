apiVersion: v1
kind: Namespace
metadata:
  name: load-observatory
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: load-observatory
type: Opaque
stringData:
  POSTGRES_DB: load_observatory
  POSTGRES_USER: load_observatory
  POSTGRES_PASSWORD: change-this-before-deploying
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: load-observatory
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: load-observatory
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: postgres-credentials } }]
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: load-observatory
spec:
  selector: { app: controller }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: load-observatory
spec:
  replicas: 1
  selector: { matchLabels: { app: controller } }
  template:
    metadata: { labels: { app: controller } }
    spec:
      containers:
        - name: controller
          image: load-observatory/controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: LISTEN_ADDR, value: ":8080" }
            - { name: DATABASE_URL, value: "postgres://load_observatory:change-this-before-deploying@postgres:5432/load_observatory?sslmode=disable" }
          ports: [{ containerPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: load-observatory
spec:
  replicas: 1
  selector: { matchLabels: { app: agent } }
  template:
    metadata: { labels: { app: agent } }
    spec:
      containers:
        - name: agent
          image: load-observatory/agent:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: CONTROLLER_URL, value: "http://controller:8080" }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: load-observatory
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: load-observatory
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: load-observatory/web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: limit-egress
  namespace: load-observatory
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
