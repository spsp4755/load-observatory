apiVersion: v1
kind: Namespace
metadata:
  name: load-observatory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-observatory
  namespace: load-observatory
automountServiceAccountToken: false
imagePullSecrets: [{ name: harbor-credentials }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: load-observatory
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: load-observatory
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      serviceAccountName: load-observatory
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999 }
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: postgres-credentials } }]
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "load_observatory"] }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { exec: { command: ["pg_isready", "-U", "load_observatory"] }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: load-observatory
spec:
  selector: { app: controller }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: load-observatory
spec:
  replicas: 1
  selector: { matchLabels: { app: controller } }
  template:
    metadata: { labels: { app: controller } }
    spec:
      serviceAccountName: load-observatory
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: controller
          image: load-observatory/controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: LISTEN_ADDR, value: ":8080" }
            - { name: PROMETHEUS_URL, value: "http://prometheus:9090" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: TARGET_API_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: TARGET_API_KEY_ENCRYPTION_KEY
            - name: CAPTURE_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: CAPTURE_PROXY_TOKEN
            # OIDC_ISSUER_URL empty (the default) means no login is required.
            # Set it to require Keycloak sign-in - see deploy/offline-deploy.md.
            - { name: OIDC_ISSUER_URL, value: "" }
            - { name: OIDC_CLIENT_ID, value: "load-observatory" }
            - { name: OIDC_REDIRECT_URL, value: "https://load-observatory.kubagents-ofc.koreacb.com/auth/callback" }
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: SESSION_SECRET
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /api/health, port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /api/health, port: 8080 }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /api/health, port: 8080 }, periodSeconds: 10, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: load-observatory
spec:
  replicas: 3
  selector: { matchLabels: { app: agent } }
  template:
    metadata: { labels: { app: agent } }
    spec:
      serviceAccountName: load-observatory
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: agent
          image: load-observatory/agent:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: CONTROLLER_URL, value: "http://controller:8080" }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: "4", memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: load-observatory
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
# Traefik reads standard Ingress objects when it runs with the Kubernetes
# Ingress provider (the default way most clusters install it), so this needs
# no Traefik-specific CRD. Swap the host below to match what DNS actually
# resolves inside the closed network, and it must equal OIDC_REDIRECT_URL's
# host on the controller Deployment above - Keycloak checks that exactly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: load-observatory
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [load-observatory.kubagents-ofc.koreacb.com]
      secretName: load-observatory-tls
  rules:
    - host: load-observatory.kubagents-ofc.koreacb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: load-observatory
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      serviceAccountName: load-observatory
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101 }
      containers:
        - name: web
          image: load-observatory/web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /, port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 10, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: load-observatory }
data:
  prometheus.yml: |
    global: { scrape_interval: 5s }
    scrape_configs:
      - job_name: dcgm
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs: [{ source_labels: [__meta_kubernetes_pod_label_app], regex: dcgm-exporter, action: keep }]
      - job_name: node
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs: [{ source_labels: [__meta_kubernetes_pod_label_app], regex: node-exporter, action: keep }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: load-observatory }
spec: { selector: { app: prometheus }, ports: [{ port: 9090, targetPort: 9090 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: load-observatory }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
          readinessProbe: { httpGet: { path: /-/ready, port: 9090 }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /-/healthy, port: 9090 }, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes: [{ name: config, configMap: { name: prometheus-config } }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: dcgm-exporter, namespace: load-observatory }
spec:
  selector: { matchLabels: { app: dcgm-exporter } }
  template:
    metadata: { labels: { app: dcgm-exporter } }
    spec:
      serviceAccountName: load-observatory
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
          ports: [{ containerPort: 9400 }]
          securityContext: { capabilities: { add: [SYS_ADMIN] } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: load-observatory }
imagePullSecrets: [{ name: harbor-credentials }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: load-observatory-prometheus }
rules: [{ apiGroups: [""], resources: [pods], verbs: [get, list, watch] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: load-observatory-prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: load-observatory-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: load-observatory }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-exporter, namespace: load-observatory }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata: { labels: { app: node-exporter } }
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: load-observatory
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args: ["--path.rootfs=/host"]
          ports: [{ containerPort: 9100 }]
          volumeMounts: [{ name: root, mountPath: /host, readOnly: true }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes: [{ name: root, hostPath: { path: / } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: limit-egress
  namespace: load-observatory
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
