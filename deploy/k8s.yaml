# Prerequisite: create the load-observatory namespace and the
# postgres-credentials Secret before applying this manifest.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-observatory
  namespace: load-observatory
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: load-observatory
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: load-observatory
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      serviceAccountName: load-observatory
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: postgres-credentials } }]
          # Do not initialize the database in the volume mount root. Some
          # NFS/CSI backends prohibit chmod on that root directory.
          env: [{ name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }]
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "load_observatory"] }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { exec: { command: ["pg_isready", "-U", "load_observatory"] }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: load-observatory
spec:
  selector: { app: controller }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: load-observatory
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: controller } }
  template:
    metadata: { labels: { app: controller } }
    spec:
      serviceAccountName: load-observatory
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: controller
          image: load-observatory/controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: LISTEN_ADDR, value: ":8080" }
            # The tested model runs on another network. Register its OpenAI
            # compatible URL and API key in the UI. Leave this empty unless
            # that model server's own Prometheus is reachable from this pod.
            - { name: PROMETHEUS_URL, value: "" }
            # Comma-separated DNS suffix allowlist for model/web targets. An
            # exact domain or any subdomain is accepted; lookalike domains are not.
            - { name: TARGET_ALLOWED_HOST_SUFFIXES, value: ".internal,.kubagents-ofc.koreacb.com" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: DATABASE_URL } }
            - name: TARGET_API_KEY_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: TARGET_API_KEY_ENCRYPTION_KEY } }
            - name: CAPTURE_PROXY_TOKEN
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: CAPTURE_PROXY_TOKEN } }
            - { name: OIDC_ISSUER_URL, value: "" }
            - { name: OIDC_CLIENT_ID, value: "load-observatory" }
            - { name: OIDC_REDIRECT_URL, value: "https://load-observatory.kubagents-ofc.koreacb.com/auth/callback" }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: OIDC_CLIENT_SECRET } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: SESSION_SECRET } }
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /api/health, port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /api/health, port: 8080 }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /api/health, port: 8080 }, periodSeconds: 10, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: load-observatory
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: agent } }
  template:
    metadata: { labels: { app: agent } }
    spec:
      serviceAccountName: load-observatory
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      containers:
        - name: agent
          image: load-observatory/agent:latest
          imagePullPolicy: IfNotPresent
          env: [{ name: CONTROLLER_URL, value: "http://controller:8080" }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: "4", memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: load-observatory
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: load-observatory
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      serviceAccountName: load-observatory
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101 }
      containers:
        - name: web
          image: load-observatory/web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /, port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 10, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
# Uses the cluster's existing Traefik ingressClass and default TLS store.
# If this cluster requires a named certificate Secret, add secretName under tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: load-observatory
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [load-observatory.kubagents-ofc.koreacb.com]
  rules:
    - host: load-observatory.kubagents-ofc.koreacb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
---
# Agents call only private-network model/web targets. Adjust these CIDRs if the
# remote model lives outside RFC1918 space. Namespace egress also permits DNS
# and communication between this namespace's workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: limit-egress
  namespace: load-observatory
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
